<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Salón Premium en Mar del Plata | Expertos en Color y Corte</title>
    <meta name="description" content="NEXUS es tu salón premium en Mar del Plata. Especialistas en colorimetría y diseño de corte. Reserva tu cita y vive una experiencia estética superior.">

    <!-- Geolocation Meta-tags (Mar del Plata) -->
    <meta name="geo.region" content="AR-B">
    <meta name="geo.placename" content="Mar del Plata">
    <meta name="geo.position" content="-38.0004;-57.5562">
    <meta name="ICBM" content="-38.0004, -57.5562">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.nexus-salon.com.ar/">
    <meta property="og:title" content="NEXUS - Salón Premium en Mar del Plata">
    <meta property="og:description" content="Experimenta la belleza en su máxima expresión. Especialistas en color y diseño de corte en Mar del Plata.">
    <!-- Image for WhatsApp / OG (ideal size 1200x630) -->
    <meta property="og:image" content="https://www.nexus-salon.com.ar/assets/og-image.jpg">
    <meta property="og:locale" content="es_AR">
    <meta property="og:site_name" content="NEXUS Salón Premium">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.nexus-salon.com.ar/">
    <meta name="twitter:title" content="NEXUS - Salón Premium en Mar del Plata">
    <meta name="twitter:description" content="Experimenta la belleza en su máxima expresión. Especialistas en color y diseño de corte en Mar del Plata.">
    <meta name="twitter:image" content="https://www.nexus-salon.com.ar/assets/og-image.jpg">

    <!-- Pre-rendering para Landing Pages dinámicas -->
    <link rel="prerender" href="/color">
    <link rel="prerender" href="/corte">

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Load Google Fonts (Playfair Display & Montserrat) with font-display: swap for LCP -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- CSS Externo con estilos Pro y Animaciones -->
    <link rel="stylesheet" href="styles.css">

    <!-- CSS Crítico Inyectado en el <head> -->
    <style>
        /* Base / Fallback crítico (la mayoría fue movido a styles.css para usar variables) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Nav */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background-color: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 2rem;
            letter-spacing: 2px;
            color: #d4af37; /* Fallback for --gold */
            text-transform: uppercase;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #d4af37;
        }

        /* Hero */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5%;
            /* Gradient overlay con fondo negro para la estética premium */
            background-image: linear-gradient(rgba(10, 10, 10, 0.85), rgba(10, 10, 10, 0.95)), url('/assets/hero-bg.jpg');
            background-size: cover;
            background-position: center;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            margin-bottom: 1rem;
            color: #d4af37;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        /* Estructura Formulario SPA */
        .booking-section {
            padding: 6rem 5%;
            max-width: 800px;
            margin: 0 auto;
        }

        .booking-section h2 {
            text-align: center;
            margin-bottom: 3rem;
            font-size: 2.5rem;
            color: #ffffff;
        }

        .step-container {
            display: none; /* Controlled by SPA router/state */
            margin-bottom: 2rem;
        }

        /* Para mostrar el primer paso por defecto en esta demo */
        .step-container.active {
            display: block;
        }

        .step-container h3 {
            margin-bottom: 1.5rem;
            color: #d4af37;
        }

        /* Simulando Skeleton en index.html inicialmente */
        .loading-state {
            display: none;
        }

    </style>
</head>
<body>

    <!-- Nav Semántico -->
    <header>
        <nav aria-label="Navegación principal">
            <div class="logo fade-in">NEXUS</div>
            <ul class="nav-links fade-in fade-in-delay-1">
                <li><a href="/">Inicio</a></li>
                <li><a href="/color">Color</a></li>
                <li><a href="/corte">Corte</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Hero con H1 optimizado para palabras clave locales -->
        <section class="hero">
            <h1 class="fade-in fade-in-delay-1">Salón de Belleza Premium en Mar del Plata</h1>
            <p class="fade-in fade-in-delay-2">Especialistas en diseño de corte y colorimetría avanzada. Eleva tu estilo y vive la experiencia NEXUS.</p>
            <button class="fade-in fade-in-delay-2 btn" onclick="document.getElementById('nexus-booking-form').scrollIntoView({behavior: 'smooth'})">Reserva Ahora</button>
        </section>

        <!-- Contenedores con ID para un formulario de 3 pasos -->
        <section class="booking-section">
            <h2>Reserva tu Experiencia</h2>

            <form id="nexus-booking-form">
                <!-- Step 1 -->
                <div id="step-1" class="step-container active glass-card fade-in">
                    <h3>Paso 1: Selecciona tu Servicio</h3>

                    <!-- Simulación de contenido cargando (Skeleton) vs Contenido real -->
                    <!-- Para demo, mostraremos cómo se vería el esqueleto -->
                    <div id="skeleton-services" style="display: none;">
                        <div class="skeleton skeleton-input"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text" style="width: 60%"></div>
                    </div>

                    <div id="actual-services">
                        <select aria-label="Seleccionar servicio">
                            <option value="">Seleccione un servicio...</option>
                            <option value="color">Colorimetría Avanzada</option>
                            <option value="corte">Diseño de Corte</option>
                            <option value="tratamiento">Tratamiento Capilar</option>
                        </select>
                        <input type="text" placeholder="¿Algún requerimiento especial?" aria-label="Requerimiento especial">
                        <button type="button" class="btn" onclick="showStep2()">Siguiente Paso</button>
                    </div>
                </div>

                <!-- Step 2 -->
                <div id="step-2" class="step-container glass-card">
                    <h3>Paso 2: Fecha y Hora</h3>
                    <input type="date" aria-label="Fecha de reserva">
                    <input type="time" aria-label="Hora de reserva">
                    <button type="button" class="btn" onclick="showStep3()">Siguiente Paso</button>
                </div>

                <!-- Step 3 -->
                <div id="step-3" class="step-container glass-card">
                    <h3>Paso 3: Tus Datos</h3>
                    <input type="text" placeholder="Nombre completo" aria-label="Nombre completo" required>
                    <input type="email" placeholder="Correo electrónico" aria-label="Correo electrónico" required>
                    <input type="tel" placeholder="Teléfono" aria-label="Teléfono" required>
                    <button type="submit" class="btn">Confirmar Reserva</button>
                </div>
            </form>
        </section>
    </main>

    <!-- Pequeño script para simular navegación SPA / Skeleton para demostración de UX Predictiva -->
    <script>
        function showStep2() {
            document.getElementById('step-1').classList.remove('active');

            // Simular carga con skeleton
            const step2 = document.getElementById('step-2');
            step2.classList.add('active');

            // Re-trigger fade in animation
            step2.style.animation = 'none';
            step2.offsetHeight; /* trigger reflow */
            step2.style.animation = null;
        }

        function showStep3() {
            document.getElementById('step-2').classList.remove('active');

            const step3 = document.getElementById('step-3');
            step3.classList.add('active');

            // Re-trigger fade in
            step3.style.animation = 'none';
            step3.offsetHeight;
            step3.style.animation = null;
        }

        // Demo de Skeleton Loading en el primer paso (simulando fetch)
        document.addEventListener('DOMContentLoaded', () => {
            const actualServices = document.getElementById('actual-services');
            const skeletonServices = document.getElementById('skeleton-services');

            actualServices.style.display = 'none';
            skeletonServices.style.display = 'block';

            // Simular carga de 2 segundos antes de mostrar el contenido real
            setTimeout(() => {
                skeletonServices.style.display = 'none';
                actualServices.style.display = 'block';
                // Trigger animation for actual services items
                actualServices.style.opacity = '0';
                actualServices.style.animation = 'fadeInOrganic 0.8s var(--ease-premium) forwards';
            }, 2000);
        });
    </script>
</body>
</html>
